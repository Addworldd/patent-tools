<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧芽专利浏览追踪助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- 顶部标题栏 -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
        </div>
        <div>
          <h1 class="brand-title">智慧芽专利追踪助手</h1>
          <span class="brand-subtitle">视口曝光 &amp; 详情点击精细化追踪</span>
        </div>
      </div>
      <button id="btnToggleTracking" class="status-btn active" title="点击开始或暂停追踪">
        <span class="status-indicator"></span>
        <span id="statusBtnText" class="status-text">追踪中</span>
      </button>
    </header>

    <!-- 项目空间切换栏 -->
    <section class="project-bar">
      <div class="project-selector-wrap">
        <span class="project-icon">
          <svg viewBox="0 0 20 20" fill="currentColor">
            <path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" />
          </svg>
        </span>
        <select id="projectSelect" class="project-select" title="切换当前工作项目"></select>
      </div>
      <div class="project-btn-group">
        <button id="btnNewProject" class="aui-btn aui-btn-secondary" title="新建工作项目">
          <svg viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
          </svg>
          <span>新建</span>
        </button>
        <button id="btnDeleteProject" class="aui-btn aui-btn-secondary btn-icon-only" title="删除当前项目">
          <svg viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
          </svg>
        </button>
      </div>
    </section>

    <!-- 统计指标卡 -->
    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">总记录数</div>
        <div class="stat-value" id="statTotal">0</div>
      </div>
      <div class="stat-card stat-clicked">
        <div class="stat-label">已看详情</div>
        <div class="stat-value" id="statClicked">0</div>
      </div>
      <div class="stat-card stat-image">
        <div class="stat-label">已看附图</div>
        <div class="stat-value" id="statImage">0</div>
      </div>
      <div class="stat-card stat-exposed">
        <div class="stat-label">仅视口扫过</div>
        <div class="stat-value" id="statExposed">0</div>
      </div>
    </section>

    <!-- 配置开关与交互 -->
    <section class="control-panel">
      <div class="control-row">
        <label class="control-label" for="toggleDim">
          <span>列表已读专利半透明淡化</span>
          <span class="hint-text">突出未读，降低视觉干扰</span>
        </label>
        <label class="switch">
          <input type="checkbox" id="toggleDim">
          <span class="slider"></span>
        </label>
      </div>

      <div class="control-row">
        <label class="control-label" for="selectViewArea">
          <span>曝光触发区域</span>
          <span class="hint-text">防止视线未移到底部即误计</span>
        </label>
        <select id="selectViewArea" class="aui-select">
          <option value="half" selected>高于页面中线 (仅上半屏)</option>
          <option value="full">整个页面视口 (露头即算)</option>
        </select>
      </div>

      <div class="control-row">
        <label class="control-label" for="inputDuration">
          <span>有效停留时长 (秒)</span>
          <span class="hint-text">停留在触发区域满此时长才记录</span>
        </label>
        <div class="duration-input-wrapper">
          <input type="number" id="inputDuration" class="aui-number-input" min="0.5" max="60" step="0.5" value="2.0">
          <span class="unit-text">秒</span>
        </div>
      </div>
    </section>

    <!-- 检索与导出工具栏 -->
    <section class="toolbar">
      <div class="search-input-wrap">
        <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="搜索已记录的公开号...">
      </div>
      <button id="btnExport" class="aui-btn aui-btn-secondary" title="导出公开号为文本或表格">
        <svg viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
        </svg>
        <span>导出</span>
      </button>
    </section>

    <!-- 记录列表预览区 -->
    <section class="records-container">
      <div class="records-header">
        <span class="records-count" id="filteredCount">记录列表</span>
        <span class="records-sort">按最近时间排序</span>
      </div>
      <div class="records-list" id="recordsList">
        <div class="empty-state">暂无专利浏览记录</div>
      </div>
    </section>

    <!-- 底部危险操作区 -->
    <footer class="app-footer">
      <button id="btnClearExposed" class="aui-btn aui-btn-light" title="保留深入研读过的记录，仅重置仅扫过的标记">
        仅清除扫过
      </button>
      <button id="btnClearAll" class="aui-btn aui-btn-danger">
        清空全部
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
