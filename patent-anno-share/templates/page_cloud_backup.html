<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{
  --brand:#1f3864; --brand2:#2f5597; --ink:#1F2937; --muted:#6b7280;
  --bg:#f7f8fa; --card:#fff; --line:#e5e7eb;
  --hl:#fff3bf; --hlb:#e8c547;
  --noted:#e3f2fd; --notedb:#64b5f6;
  --mine:#ffe0e0; --mineb:#ef9a9a;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"FangSong","仿宋","Times New Roman",serif; font-size:10pt;
  line-height:1.85;
}
header{
  position:sticky; top:0; z-index:50; background:var(--card);
  border-bottom:1px solid var(--line); padding:10px 20px;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  box-shadow:0 1px 3px rgba(0,0,0,.04);
}
header h1{font-size:14pt; margin:0; color:var(--brand); font-weight:700}
header .sub{font-size:9pt; color:var(--muted)}
header .stat{font-size:9pt; color:var(--muted); margin-left:auto}
header .stat b{color:var(--brand2); font-family:"Times New Roman",serif}
header button{
  font-family:inherit; font-size:9pt; padding:4px 12px; cursor:pointer;
  border:1px solid var(--brand2); background:#fff; color:var(--brand2);
  border-radius:4px;
}
header button:hover{background:var(--brand2); color:#fff}
main{max-width:980px; margin:0 auto; padding:20px 20px 120px}
.gtitle{
  margin:26px 0 12px; padding:6px 12px; background:var(--brand); color:#fff;
  font-size:11pt; font-weight:700; border-radius:4px; letter-spacing:.5px;
}
.p{
  background:var(--card); border:1px solid var(--line); border-radius:6px;
  padding:12px 14px; margin:0 0 12px;
}
.p .no{
  font-size:9pt; color:var(--brand2); font-weight:700;
  font-family:"Times New Roman",serif; margin-bottom:6px;
}
.p .en{color:#374151; margin-bottom:8px}
.p .zh{color:var(--ink)}
.p .en::before{
  content:"EN"; display:inline-block; font-size:7.5pt; color:#9ca3af;
  font-family:"Times New Roman",serif; margin-right:6px; vertical-align:top;
  border:1px solid #d1d5db; border-radius:2px; padding:0 3px; line-height:1.2;
}
.p .zh::before{
  content:"译"; display:inline-block; font-size:7.5pt; color:#9ca3af;
  margin-right:6px; vertical-align:top;
  border:1px solid #d1d5db; border-radius:2px; padding:0 3px; line-height:1.2;
}
mark{
  background:var(--hl); border-bottom:1.5px solid var(--hlb);
  padding:0 1px; border-radius:2px; cursor:pointer;
}
mark.noted{background:var(--noted); border-bottom-color:var(--notedb)}
mark.mine{background:var(--mine); border-bottom-color:var(--mineb)}
.noteline{
  margin-top:8px; padding:7px 10px; background:#fafafa;
  border-left:3px solid var(--notedb); font-size:9pt; color:#4b5563;
  border-radius:0 4px 4px 0;
}
.noteline b{color:var(--brand2); font-weight:700}
.noteline .who{color:var(--muted); font-size:8.5pt; margin-left:6px}

/* 划选工具条 */
#tb{
  position:absolute; display:none; z-index:100; gap:6px; align-items:center;
  background:var(--brand); color:#fff; padding:5px 10px; border-radius:5px;
  font-size:9pt; box-shadow:0 3px 10px rgba(0,0,0,.25);
}
#tb span{opacity:.85}
#tb b{font-family:"Times New Roman",serif}
#tb button{
  font-family:inherit; font-size:9pt; padding:2px 10px; cursor:pointer;
  border:none; border-radius:3px; background:#fff; color:var(--brand); font-weight:700;
}
#tb button.ghost{background:transparent; color:#fff; border:1px solid rgba(255,255,255,.5); font-weight:400}

/* 编辑器 */
#editor{
  position:fixed; display:none; z-index:120; left:50%; top:50%;
  transform:translate(-50%,-50%); width:min(560px,92vw);
  background:var(--card); border-radius:8px; padding:18px 20px;
  box-shadow:0 10px 40px rgba(0,0,0,.28); border:1px solid var(--line);
}
#editor h3{margin:0 0 10px; font-size:11pt; color:var(--brand)}
#edText{
  background:#f3f4f6; padding:8px 10px; border-radius:4px; font-size:9pt;
  color:#4b5563; max-height:90px; overflow:auto; margin-bottom:10px;
  line-height:1.6;
}
#edNote{
  width:100%; min-height:88px; font-family:inherit; font-size:10pt;
  padding:8px 10px; border:1px solid var(--line); border-radius:4px;
  resize:vertical; line-height:1.7; color:var(--ink);
}
#edFoot{display:flex; gap:8px; margin-top:12px; align-items:center}
#edFoot button{
  font-family:inherit; font-size:9pt; padding:5px 14px; cursor:pointer;
  border-radius:4px; border:1px solid var(--brand2); background:#fff; color:var(--brand2);
}
#edFoot button.primary{background:var(--brand2); color:#fff}
#edFoot button.danger{border-color:#dc2626; color:#dc2626}
#edFoot .sp{margin-left:auto}

#toast{
  position:fixed; left:50%; bottom:40px; transform:translateX(-50%);
  background:#111827; color:#fff; padding:9px 18px; border-radius:6px;
  font-size:9.5pt; opacity:0; pointer-events:none; transition:opacity .25s;
  z-index:200; max-width:80vw;
}
#toast.show{opacity:.94}
#toast.err{background:#b91c1c}

.legend{
  max-width:980px; margin:0 auto; padding:8px 20px; font-size:8.5pt; color:var(--muted);
  display:flex; gap:16px; flex-wrap:wrap;
}
.legend i{
  display:inline-block; width:22px; height:10px; border-radius:2px;
  vertical-align:middle; margin-right:4px;
}
</style>
</head>
<body>

<header>
  <div>
    <h1>__TITLE__</h1>
    <div class="sub">__SUBTITLE__</div>
  </div>
  <div class="stat">
    共 <b id="cPara">0</b> 段 · 高亮 <b id="cMark">0</b> · 有备注 <b id="cNote">0</b>
    · <span id="syncState">同步中…</span><span id="pendState"></span>
  </div>
  <button id="btnSync">同步</button>
  <button id="btnExport">导出批注</button>
  <button id="btnRefresh">刷新批注</button>
</header>

<div class="legend">
  <span><i style="background:var(--hl);border-bottom:1.5px solid var(--hlb)"></i>预置高亮</span>
  <span><i style="background:var(--noted);border-bottom:1.5px solid var(--notedb)"></i>已写备注</span>
  <span><i style="background:var(--mine);border-bottom:1.5px solid var(--mineb)"></i>我新加的</span>
</div>

<main id="main"></main>

<div id="tb">
  <span>已选 <b id="tbLen">0</b> 字</span>
  <button id="tbAdd">加高亮</button>
  <button class="ghost" id="tbCancel">取消</button>
</div>

<div id="editor">
  <h3>高亮备注</h3>
  <div id="edText"></div>
  <textarea id="edNote" placeholder="写一句解读，例如：相当于权27 的②，密封件位于吸嘴内部"></textarea>
  <div id="edFoot">
    <button class="primary" id="edSave">保存</button>
    <button class="danger" id="edDel">删除</button>
    <span class="sp"></span>
    <button id="edClose">关闭</button>
  </div>
</div>

<div id="toast"></div>

<script>
const DATA = __DATA__;
const DOC_ID = __DOC_ID__;
const CLOUD = __CLOUD_CFG__;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SIDE = {en:'原文', zh:'译文'};
const S = {
  marks: [],      // 合并后的全部批注（云端 + 本地）
  sel: null,      // 当前划选
  editKey: null,  // 正在编辑的批注 key
  online: false,
  pending: 0,     // 待同步条数
};

const LS_CACHE = 'anno.cache.' + DOC_ID;   // 云端数据快照，供离线查看
const LS_QUEUE = 'anno.queue.' + DOC_ID;   // 待同步操作队列
const LS_MINE  = 'anno.mine.'  + DOC_ID;   // 本地新增/修改的批注

/* ---------- 本地存储 ---------- */
function lsGet(k, def){
  try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }
  catch(e){ return def; }
}
function lsSet(k, v){
  try{ localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch(e){ console.warn('localStorage 写入失败', e); return false; }
}

/* 队列结构：{op:'upsert'|'delete', key, payload, ts} */
function queuePush(op){
  const q = lsGet(LS_QUEUE, []);
  // 同一 key 只保留最后一次操作
  const filtered = q.filter(x => x.key !== op.key);
  filtered.push(op);
  lsSet(LS_QUEUE, filtered);
  S.pending = filtered.length;
  updatePendingUI();
}
function queueAll(){ return lsGet(LS_QUEUE, []); }
function queueClear(){ lsSet(LS_QUEUE, []); S.pending = 0; updatePendingUI(); }

function updatePendingUI(){
  const el = document.getElementById('pendState');
  if(!el) return;
  if(S.pending > 0){
    el.textContent = '· ' + S.pending + ' 条待同步';
    el.style.color = '#b45309';
  }else{
    el.textContent = '';
  }
}

/* ---------- 云端 ---------- */
let db = null;
function initCloud(){
  if (!CLOUD || !CLOUD.endpoint || !CLOUD.publishableKey) return false;
  try{
    const cloud = WorkBuddyCloud.createWorkBuddyCloud({
      endpoint: CLOUD.endpoint,
      publishableKey: CLOUD.publishableKey,
    });
    db = cloud.database;
    return true;
  }catch(e){
    console.warn('cloud init failed', e);
    return false;
  }
}

/* 拉取本文档全部批注；成功后写本地快照 */
async function fetchMarks(){
  if(!db){ S.online=false; setSync('离线'); loadLocalMarks(); return; }
  try{
    let all = [], from = 0, page = 500;
    while(true){
      const { data, error } = await db.from('annotations')
        .select('*').eq('doc_id', DOC_ID).range(from, from + page - 1);
      if(error) throw error;
      if(!data || !data.length) break;
      all = all.concat(data);
      if(data.length < page) break;
      from += page;
    }
    const remote = all.map(r => ({
      key: r.mark_key, no: r.para_no, side: r.side,
      s: r.start_off, e: r.end_off,
      text: r.sel_text || '', note: r.note || '',
      author: r.author || '', mine: false,
    }));
    lsSet(LS_CACHE, remote);          // 缓存供离线查看
    S.online = true;
    mergeLocal(remote);
    setSync('已同步 ' + remote.length + ' 条');
  }catch(e){
    console.warn(e);
    S.online = false;
    loadLocalMarks();
    setSync('离线（用本地缓存）');
  }
}

/* 离线时用缓存 + 本地改动拼出可读视图 */
function loadLocalMarks(){
  const cached = lsGet(LS_CACHE, []);
  mergeLocal(cached);
}

/* 把本地改动叠加到云端数据上（本地优先） */
function mergeLocal(remote){
  const mine = lsGet(LS_MINE, []);
  const q = queueAll();
  const deleted = new Set(q.filter(x => x.op === 'delete').map(x => x.key));
  const map = new Map();
  remote.forEach(m => { if(!deleted.has(m.key)) map.set(m.key, m); });
  mine.forEach(m => { if(!deleted.has(m.key)) map.set(m.key, {...m, mine:true}); });
  S.marks = [...map.values()];
  S.pending = q.length;
  updatePendingUI();
}

/* 写入 / 更新一条批注：先落本地，再尝试云端 */
async function upsertMark(m){
  // 1) 本地立即生效
  const mine = lsGet(LS_MINE, []);
  const idx = mine.findIndex(x => x.key === m.key);
  const rec = {...m, mine:true, ts:Date.now()};
  if(idx >= 0) mine[idx] = rec; else mine.push(rec);
  lsSet(LS_MINE, mine);

  // 2) 联网则直接写云端
  if(db && S.online){
    try{
      const { error } = await db.from('annotations').upsert({
        doc_id: DOC_ID, mark_key: m.key, para_no: m.no, side: m.side,
        start_off: m.s, end_off: m.e, sel_text: m.text,
        note: m.note, author: m.author || getAuthor(),
        updated: new Date().toISOString(),
      }, { onConflict: 'mark_key' });
      if(error) throw error;
      return true;
    }catch(e){
      console.warn('云端写入失败，转本地队列', e);
    }
  }

  // 3) 离线/失败 → 入队
  queuePush({op:'upsert', key:m.key, ts:Date.now(),
             payload:{doc_id:DOC_ID, mark_key:m.key, para_no:m.no, side:m.side,
                      start_off:m.s, end_off:m.e, sel_text:m.text,
                      note:m.note, author:m.author || getAuthor(),
                      updated:new Date().toISOString()}});
  return false;
}

async function deleteMark(key){
  // 1) 本地移除
  lsSet(LS_MINE, lsGet(LS_MINE, []).filter(x => x.key !== key));

  // 2) 联网则直接删云端
  if(db && S.online){
    try{
      const { error } = await db.from('annotations').delete().eq('mark_key', key);
      if(error) throw error;
      return true;
    }catch(e){
      console.warn('云端删除失败，转本地队列', e);
    }
  }

  // 3) 离线 → 入队
  queuePush({op:'delete', key, ts:Date.now(), payload:{mark_key:key, doc_id:DOC_ID}});
  return false;
}

/* 把队列里所有待同步操作发给云端 */
async function flushQueue(){
  if(!db) { toast('当前离线，已存本地，联网后自动同步', 3000, true); return 0; }
  const q = queueAll();
  if(!q.length) return 0;

  let done = 0, fail = 0;
  for(const op of q){
    try{
      if(op.op === 'upsert'){
        const { error } = await db.from('annotations')
          .upsert(op.payload, { onConflict: 'mark_key' });
        if(error) throw error;
      }else{
        const { error } = await db.from('annotations')
          .delete().eq('mark_key', op.payload.mark_key);
        if(error) throw error;
      }
      done++;
      // 已同步的从队列移除
      const cur = queueAll().filter(x => !(x.key === op.key && x.ts === op.ts));
      lsSet(LS_QUEUE, cur);
    }catch(e){
      console.warn('同步失败', op, e);
      fail++;
      break;   // 一条失败就停，避免连环报错
    }
  }
  S.pending = queueAll().length;
  updatePendingUI();
  if(done) toast('已同步 ' + done + ' 条到云端' + (fail ? '，' + fail + ' 条待重试' : ''));
  return done;
}

function getAuthor(){
  let a = localStorage.getItem('anno.author') || '';
  if(!a){
    a = (prompt('你的名字（批注上会显示，留空则匿名）') || '匿名').trim() || '匿名';
    localStorage.setItem('anno.author', a);
  }
  return a;
}

/* ---------- 渲染 ---------- */
function marksOf(no, side){
  return S.marks.filter(m => m.no === no && m.side === side)
                .sort((a,b) => a.s - b.s);
}

function htmlOf(no, side, plain, marks){
  let out = '', cur = 0;
  for(const m of marks){
    const s = m.s, e = Math.min(m.e, plain.length);
    if(s < cur || e <= s) continue;      // 跳过重叠
    const cls = m.mine ? 'mine' : (m.note && m.note.trim() ? 'noted' : '');
    out += esc(plain.slice(cur, s))
        + '<mark' + (cls ? ' class="' + cls + '"' : '')
        + ' data-key="' + esc(m.key) + '" data-no="' + no + '" data-side="' + side + '">'
        + esc(plain.slice(s, e)) + '</mark>';
    cur = e;
  }
  return out + esc(plain.slice(cur));
}

function paint(){
  const y = window.scrollY;
  const main = document.getElementById('main');
  main.innerHTML = '';
  let g = null, nM = 0, nN = 0;

  for(const it of DATA.items){
    if(it.group !== g){
      g = it.group;
      const t = document.createElement('div');
      t.className = 'gtitle'; t.textContent = g || '正文';
      main.appendChild(t);
    }
    const box = document.createElement('div');
    box.className = 'p';

    const noEl = document.createElement('div');
    noEl.className = 'no'; noEl.textContent = '【' + it.no + '】';
    box.appendChild(noEl);

    const em = marksOf(it.no, 'en'), zm = marksOf(it.no, 'zh');

    for(const [side, cls, text, mk] of [['en','en',it.en,em], ['zh','zh',it.zh,zm]]){
      const d = document.createElement('div');
      d.className = cls;
      d.dataset.no = it.no;
      d.dataset.side = side;
      d.innerHTML = htmlOf(it.no, side, text || '', mk);
      box.appendChild(d);
    }

    // 备注列表
    for(const side of ['en','zh']){
      for(const m of (side === 'en' ? em : zm)){
        if(m.note && m.note.trim()){
          const d = document.createElement('div');
          d.className = 'noteline';
          d.innerHTML = '<b>' + SIDE[side] + ' · ' + m.s + '–' + m.e + '</b>：'
                      + esc(m.note)
                      + (m.author ? '<span class="who">— ' + esc(m.author) + '</span>' : '');
          box.appendChild(d);
          nN++;
        }
      }
    }
    nM += em.length + zm.length;
    main.appendChild(box);
  }

  window.scrollTo(0, y);
  document.getElementById('cPara').textContent = DATA.items.length;
  document.getElementById('cMark').textContent = nM;
  document.getElementById('cNote').textContent = nN;
}

function setSync(t){
  const el = document.getElementById('syncState');
  if(el) el.textContent = t;
}

/* ---------- 划选 ---------- */
function offsetOf(container, node, off){
  const w = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null);
  let total = 0, n;
  while((n = w.nextNode())){
    if(n === node) return total + off;
    total += n.textContent.length;
  }
  return null;
}

function currentSel(){
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed || !sel.rangeCount) return null;
  const r = sel.getRangeAt(0);
  const a = r.startContainer.parentElement && r.startContainer.parentElement.closest('[data-no]');
  const b = r.endContainer.parentElement && r.endContainer.parentElement.closest('[data-no]');
  if(!a || a !== b) return null;          // 必须同一段
  const s = offsetOf(a, r.startContainer, r.startOffset);
  const e = offsetOf(a, r.endContainer, r.endOffset);
  if(s === null || e === null || e <= s) return null;
  const text = a.textContent.slice(s, e);
  if(!text.trim()) return null;
  return {no: a.dataset.no, side: a.dataset.side, start: s, end: e, text, rect: r.getBoundingClientRect()};
}

function showToolbar(){
  const s = currentSel(), tb = document.getElementById('tb');
  if(!s){ tb.style.display = 'none'; S.sel = null; return; }
  S.sel = s;
  document.getElementById('tbLen').textContent = s.end - s.start;
  tb.style.display = 'flex';
  tb.style.left = Math.max(8, window.scrollX + s.rect.left) + 'px';
  tb.style.top  = Math.max(8, window.scrollY + s.rect.top - 46) + 'px';
}

function toast(msg, ms, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = isErr ? 'show err' : 'show';
  clearTimeout(t._h);
  t._h = setTimeout(() => t.className = '', ms || 2400);
}

/* ---------- 编辑 ---------- */
function findMark(key){ return S.marks.find(m => m.key === key); }

function openEditor(key){
  const m = findMark(key);
  if(!m){ toast('找不到这条高亮', 2000, true); return; }
  S.editKey = key;
  document.getElementById('edText').textContent = m.text || '(无选中文字)';
  document.getElementById('edNote').value = m.note || '';
  document.getElementById('editor').style.display = 'block';
  document.getElementById('edNote').focus();
}

/* ---------- 事件 ---------- */
document.addEventListener('mouseup', () => setTimeout(showToolbar, 10));
document.addEventListener('keyup', ev => {
  if(ev.key === 'Escape'){
    document.getElementById('tb').style.display = 'none';
    document.getElementById('editor').style.display = 'none';
  }
});

document.getElementById('tbCancel').onclick = () => {
  window.getSelection().removeAllRanges();
  document.getElementById('tb').style.display = 'none';
};

document.getElementById('tbAdd').onclick = async () => {
  const s = S.sel;
  if(!s) return;
  const key = s.no + '|' + s.side + '|' + s.start + '|' + s.end;
  if(!S.marks.some(m => m.key === key)){
    const rec = {key, no: s.no, side: s.side, s: s.start, e: s.end,
                 text: s.text, note: '', author: getAuthor(), mine: true};
    S.marks.push(rec);
    paint();
    openEditor(key);
    window.getSelection().removeAllRanges();
    document.getElementById('tb').style.display = 'none';
    toast('已加高亮，写好备注点保存');
  }else{
    openEditor(key);
  }
};

document.getElementById('main').addEventListener('click', ev => {
  const mk = ev.target.closest('mark');
  if(!mk) return;
  openEditor(mk.dataset.key);
});

document.getElementById('edSave').onclick = async () => {
  const m = findMark(S.editKey);
  if(!m) return;
  m.note = document.getElementById('edNote').value.trim();
  m.mine = true;
  const ok = await upsertMark(m);
  document.getElementById('editor').style.display = 'none';
  paint();
  toast(ok ? '已保存并同步到云端' : '已保存到本页（未同步）', 2600, !ok);
};

document.getElementById('edDel').onclick = async () => {
  const key = S.editKey;
  const ok = await deleteMark(key);
  S.marks = S.marks.filter(m => m.key !== key);
  document.getElementById('editor').style.display = 'none';
  paint();
  toast(ok ? '已删除' : '本地已移除（云端未同步）', 2400, !ok);
};

document.getElementById('edClose').onclick = () => {
  document.getElementById('editor').style.display = 'none';
};

document.getElementById('btnRefresh').onclick = async () => {
  setSync('拉取中…');
  await fetchMarks();
  paint();
  toast('已刷新');
};

/* 导出 Markdown 汇总 */
document.getElementById('btnExport').onclick = () => {
  const rows = S.marks.filter(m => m.note && m.note.trim())
    .sort((a,b) => a.no.localeCompare(b.no) || (a.side === 'en' ? -1 : 1) || a.s - b.s);
  let L = ['# ' + DATA.title + ' · 批注汇总', '',
           '- 文档：' + DOC_ID,
           '- 导出时间：' + new Date().toLocaleString('zh-CN'),
           '- 批注条数：**' + rows.length + '**', '',
           '| # | 段号 | 侧 | 位置 | 选中文字 | 备注 | 批注人 |',
           '|---|---|---|---|---|---|---|'];
  rows.forEach((m, i) => {
    const t = (m.text || '').replace(/\|/g, '\\|').replace(/\n/g, ' ');
    const txt = t.length > 80 ? t.slice(0, 80) + '…' : t;
    const n = (m.note || '').replace(/\|/g, '\\|').replace(/\n/g, ' ');
    L.push(`| ${i+1} | 【${m.no}】 | ${SIDE[m.side]} | ${m.s}–${m.e} | ${txt} | ${n} | ${m.author || ''} |`);
  });
  if(!rows.length) L.push('| — | — | — | — | — | 暂无批注 | — |');

  const blob = new Blob([L.join('\n')], {type: 'text/markdown;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = DOC_ID + '_批注汇总.md';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast('已导出 ' + rows.length + ' 条批注');
};

/* ---------- 启动 ---------- */
async function boot(){
  document.getElementById('cPara').textContent = DATA.items.length;

  // 先用本地缓存渲染，保证离线也能看
  loadLocalMarks();
  paint();

  const ok = initCloud();
  if(ok){
    await fetchMarks();
    await flushQueue();      // 上次离线留下的操作，联网即补发
    paint();
  }else{
    setSync('离线（仅本地）');
  }

  // 联网恢复时自动补发
  window.addEventListener('online', async () => {
    setSync('网络恢复，同步中…');
    if(ok){
      await flushQueue();
      await fetchMarks();
      paint();
    }
  });
  window.addEventListener('offline', () => setSync('离线（用本地缓存）'));

  // 定时轮询：拉新 + 补发待同步
  if(ok){
    setInterval(async () => {
      const before = queueAll().length;
      if(before) await flushQueue();
      await fetchMarks();
      paint();
    }, 60000);
  }
}

document.getElementById('btnSync').onclick = async () => {
  const n = await flushQueue();
  await fetchMarks();
  paint();
  if(!n && !queueAll().length) toast('已是最新');
};

boot();
</script>
